    <script>
      // ======================= shared world data =======================
      // One geometry for both renderers: the 2D floor plan is the exact top-down projection of the 3D office.
      const TOP = { cx: 0, zt: -0.9, ppu: 70, y: 0 };
      const R = 5.0, N = 12;
      const D2R = Math.PI / 180;
      const RANI = 6, DIMAS = 2, ALLIES = [10, 0, 4], ASKER = 7, PICK = [4, 8, 11], FOCUS = 3;
      const ALLY_T = [56.29, 57.58, 58.95];
      const NODES = Array.from({ length: N }, (_, i) => {
        const ang = -90 + 30 * i, a = ang * D2R;
        return { i, ang, c: [R * Math.cos(a), R * Math.sin(a)], desk: [(R + 0.95) * Math.cos(a), (R + 0.95) * Math.sin(a)] };
      });
      const ROOM = { w: 3.6, d: 2.4 };
      const DESK = { w: 1.5, d: 0.7 };
      const PLANTS = [[-6.3, -6.1, 0.55], [6.3, 6.1, 0.55], [6.2, -6.2, 0.4]];
      const DOOR = { x: 0, z: 7.0, w: 1.3 };
      const PAIRS = [];
      for (let i = 0; i < N; i++)
        for (let j = i + 1; j < N; j++) {
          const rani = i === RANI || j === RANI, dimas = i === DIMAS || j === DIMAS;
          const allyEnd = ALLIES.includes(i) ? i : ALLIES.includes(j) ? j : -1;
          const other = (n) => (n === i ? j : i);
          // endpoint order: the line is drawn from `a` to `b`
          let a = i;
          if (rani) a = RANI;
          else if (dimas) a = DIMAS;
          else if (allyEnd >= 0) a = allyEnd;
          const b = other(a);
          PAIRS.push({ i, j, a, b, rani, dimas, ally: allyEnd >= 0 && !dimas, dimasAlly: dimas && allyEnd >= 0, focus: i === FOCUS || j === FOCUS, pick: rani && (PICK.includes(i) || PICK.includes(j)), allyIdx: allyEnd >= 0 ? ALLIES.indexOf(allyEnd) : -1 });
        }
      // deterministic stagger per chord
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rndS = mulberry32(7);
      const STAG = PAIRS.map(() => rndS());
      const MORPH_IN = 40.6, MORPH_OUT = 53.0, END = 80;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const io = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eOut = (u) => 1 - Math.pow(1 - u, 3);
      const eIn = (u) => u * u * u;
      const lin = (u) => u;
      const backOut = (u) => { const c1 = 1.70158, c3 = c1 + 1; return u <= 0 ? 0 : 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
      const seg = (t, a, b, ease = io) => ease(clamp01((t - a) / (b - a)));
      const lerp = (a, b, u) => a + (b - a) * u;
      const pulse = (t, t0, d = 0.6) => { const u = (t - t0) / d; return u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0; };

      // Rani's position in world units (hook desk → lap around the ring → back → out of the door)
      function raniPos(t) {
        const p = seg(t, 4.7, 8.45, lin);
        if (p > 0 && p < 1) {
          const a = (90 + p * 360) * D2R;
          return [R * Math.cos(a), R * Math.sin(a)];
        }
        const e = seg(t, 76.0, 77.3, io);
        if (e > 0) return [0, lerp(R, 8.9, e)];
        return NODES[RANI].c;
      }
      // 3D line state shared with the module (chords on the floor / arcs)
      function chord3D(k, t) {
        const p = PAIRS[k], sg = STAG[k];
        if (p.rani) {
          const up = seg(t, 43.44 + sg * 0.5, 43.95 + sg * 0.5, eOut);
          const down = seg(t, 52.4, 52.9);
          let bright = 1 - 0.55 * seg(t, 48.47, 49.0);
          bright += 0.6 * pulse(t, 49.63 + sg * 0.25, 0.5);
          return { vis: up, lift: 2.4 * up * (1 - down), col: "gold", bright };
        }
        const red = seg(t, 51.76, 52.3);
        const flat = seg(t, 52.5, 52.9);
        return { vis: 1, lift: 0.45 * red * (1 - flat), col: "red", bright: lerp(0.55, 1.0, red) * (1 - 0.4 * flat) };
      }
      window.OFFICE = { TOP, R, N, NODES, ROOM, DESK, PLANTS, DOOR, PAIRS, STAG, RANI, DIMAS, ALLIES, MORPH_IN, MORPH_OUT, raniPos, chord3D };
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["office3d"] = new Promise((res) => (window.__officeReady = res));

      // ======================= helpers =======================
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const F = 1 / 60;
      const NS = "http://www.w3.org/2000/svg";
      function el(tag, attrs, parent) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      const proj = (x, z) => [540 + (x - TOP.cx) * TOP.ppu, 960 + (z - TOP.zt) * TOP.ppu];
      const PX = TOP.ppu;
      const [CX, CY] = proj(0, 0);
      const fadeIn = (n, t, d = 0.25) => tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const fadeOut = (n, t, d = 0.2) => tl.to(n, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const rgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
      const mix = (a, b, u) => a.map((v, i) => Math.round(lerp(v, b[i], u)));
      const css = (c, op) => `rgba(${c[0]},${c[1]},${c[2]},${op.toFixed(3)})`;
      const SLATE = rgb("#a7b0c4"), GOLD = rgb("#ffc53d"), GREEN = rgb("#3dd68c"), RED = rgb("#ff6369"), AMBER = rgb("#b07a2a"), WHITE = rgb("#d9dfeb"), PINK = rgb("#ff8fa3");

      // ======================= 2D illustration =======================
      // floor
      const floorG = $("floor");
      el("rect", { x: 540 - 7.2 * PX, y: CY - 7.0 * PX, width: 14.4 * PX, height: 14 * PX, rx: 16, fill: "rgba(255,255,255,0.03)", stroke: "rgba(255,255,255,0.11)", "stroke-width": 2 }, floorG);
      // window strip along the top wall
      el("rect", { x: 540 - 5.5 * PX, y: CY - 7.0 * PX - 6, width: 11 * PX, height: 8, rx: 3, fill: "rgba(180,210,255,0.22)" }, floorG);
      // door at the bottom wall
      el("rect", { x: 540 + (DOOR.x - DOOR.w / 2) * PX, y: CY + (DOOR.z - 0.06) * PX, width: DOOR.w * PX, height: 0.12 * PX, rx: 3, fill: "#5a4630" }, floorG);
      el("path", { d: `M${540 - (DOOR.w / 2) * PX} ${CY + DOOR.z * PX} A ${DOOR.w * PX} ${DOOR.w * PX} 0 0 0 ${540 + (DOOR.w / 2) * PX} ${CY + DOOR.z * PX - DOOR.w * PX}`, fill: "none", stroke: "rgba(255,255,255,0.14)", "stroke-width": 1.5, "stroke-dasharray": "5 5" }, floorG);
      // desks + monitors
      NODES.forEach((n) => {
        const [x, y] = proj(n.desk[0], n.desk[1]);
        const g = el("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(n.ang + 90).toFixed(1)})` }, $("desks"));

            _s.set(len * 1.08, 0.04, st.col === "gold" ? 0.07 : 0.045);
            _m.compose(_p, _q, _s);
            chords.setMatrixAt(idx, _m);
            _c.copy(base).multiplyScalar(st.col === "gold" ? 0.15 + 0.95 * st.bright : 0.08 + 0.5 * st.bright);
            chords.setColorAt(idx, _c);
          }
        });
        chords.instanceMatrix.needsUpdate = true;
        chords.instanceColor.needsUpdate = true;
      }

      // ---------- speech bubbles inside the room ----------
      const bubbleTex = (() => {
        const cv = document.createElement("canvas");
        cv.width = cv.height = 64;
        const g = cv.getContext("2d");
        const gr = g.createRadialGradient(32, 32, 4, 32, 32, 30);
        gr.addColorStop(0, "rgba(255,200,215,0.95)"); gr.addColorStop(0.6, "rgba(255,160,185,0.7)"); gr.addColorStop(1, "rgba(255,160,185,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(32, 32, 30, 0, Math.PI * 2); g.fill();
        const tx = new THREE.CanvasTexture(cv);
        tx.colorSpace = THREE.SRGBColorSpace;
        return tx;
      })();
      const rnd = mulberry32(11);
      const NBB = 160;
      const bub = Array.from({ length: NBB }, () => ({ a: rnd() * Math.PI * 2, r: 0.15 + 0.85 * rnd(), y: rnd(), w: 0.3 + 0.5 * rnd() }));
      const bubGeo = new THREE.BufferGeometry();
      bubGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NBB * 3), 3));
      const bubMat = new THREE.PointsMaterial({ map: bubbleTex, size: 0.34, sizeAttenuation: true, transparent: true, depthWrite: false, opacity: 0.9 });
      const bubPts = new THREE.Points(bubGeo, bubMat);
      bubPts.frustumCulled = false;
      scene.add(bubPts);
      function updateBubbles(t) {
        const q = bubGeo.attributes.position.array;
        const h = 0.3 + 1.5 * rise(t);
        bub.forEach((b, i) => {
          const a = b.a + b.w * (t - 40);
          q[i * 3] = Math.cos(a) * b.r * (ROOM.w / 2 - 0.35);
          q[i * 3 + 1] = 0.12 + ((b.y + 0.12 * (t - 40)) % 1) * h;
          q[i * 3 + 2] = Math.sin(a) * b.r * (ROOM.d / 2 - 0.3);
        });
        bubGeo.attributes.position.needsUpdate = true;
        bubMat.opacity = 0.9 * seg(t, MORPH_IN, MORPH_IN + 0.3) * (1 - seg(t, 52.4, 52.9));
        bubPts.visible = bubMat.opacity > 0.01;
      }

      // ---------- per-frame object state ----------
      function updateWorld(t) {
        const r = rise(t);
        const hDesk = lerp(0.05, 0.55, r), hPerson = lerp(0.05, 0.62, r), hWall = lerp(0.05, 2.2, r), hTable = lerp(0.05, 0.72, r), hPlant = lerp(0.05, 1.0, r);
        desks.forEach(({ d, m }) => {
          d.scale.set(DESK.w, hDesk, DESK.d); d.position.y = hDesk / 2;
          m.scale.set(0.6, lerp(0.02, 0.4, r), 0.12); m.position.set(0, hDesk + m.scale.y / 2, -DESK.d / 2 + 0.16);
        });
        const rp = raniPos(t);
        people.forEach((m, i) => {
          m.scale.y = hPerson; m.position.y = hPerson / 2;
          if (i === RANI) m.position.set(rp[0], hPerson / 2, rp[1]);
        });
        table.scale.set(1, hTable, 0.5); table.position.y = hTable / 2;
        walls.forEach(({ g, f, s }) => {
          g.scale.set(s[0], hWall, s[2]); g.position.y = hWall / 2;
          f.scale.set(s[0] + 0.02, 0.06, s[2] + 0.02); f.position.y = hWall;
        });
        plants.forEach((m) => { m.scale.y = hPlant; m.position.y = hPlant / 2; });
      }

      // ---------- camera ----------
      // Top-down key reproduces the 2D projection exactly: height = 960 / (ppu · tan(fov/2)).
      const hTop = 960 / (TOP.ppu * Math.tan((15 * Math.PI) / 180));
      const TOPKEY = { tg: [TOP.cx, TOP.y, TOP.zt], d: hTop, yaw: 0, pitch: 89.9, fov: 30, sh: 0 };
      const K = [
        { t: MORPH_IN - 0.2, ...TOPKEY },
        { t: MORPH_IN + 0.15, ...TOPKEY, e: "lin" },
        { t: 41.45, tg: [0, 0.7, 0.4], d: 23, yaw: 0, pitch: 36, fov: 30, sh: 1.0 }, // tilt: the office stands up, the room ahead
        { t: 41.6, tg: [0, 0.7, 0.4], d: 23, yaw: 0, pitch: 36, fov: 30, sh: 1.0, e: "lin" },
        { t: 42.4, tg: [0, 0.9, 0], d: 16, yaw: 6, pitch: 24, fov: 30, sh: 0.8 }, // push to the glass, never inside
        { t: 43.3, tg: [0, 0.9, 0], d: 15.6, yaw: 8, pitch: 24, fov: 30, sh: 0.8, e: "lin" },
        { t: 44.2, tg: [0, 0.4, 0.9], d: 47, yaw: 18, pitch: 50, fov: 30, sh: 1.3 }, // wide: Rani's arcs to every desk
        { t: 47.7, tg: [0, 0.4, 0.9], d: 45.5, yaw: 24, pitch: 52, fov: 30, sh: 1.3, e: "lin" },
        { t: 48.6, tg: [0, 0.6, 1.6], d: 31, yaw: 12, pitch: 34, fov: 30, sh: 1.0 }, // "capek": closer, from Rani's side
        { t: 51.0, tg: [0, 0.6, 1.6], d: 30, yaw: 8, pitch: 33, fov: 30, sh: 1.0, e: "lin" },
        { t: 51.9, tg: [0, 0.3, 0], d: 41, yaw: 0, pitch: 64, fov: 30, sh: 0.7 }, // "di balik": looking down at the red web
        { t: 52.45, tg: [0, 0.3, 0], d: 41, yaw: 0, pitch: 64, fov: 30, sh: 0.7, e: "lin" },
        { t: MORPH_OUT, ...TOPKEY, e: "out" }, // = the 2D drawing again
        { t: MORPH_OUT + 0.4, ...TOPKEY, e: "lin" },
      ];
      const EASE = { io, lin: (u) => u, in: eIn, out: eOut };
      const tgt = new THREE.Vector3(), camUp = new THREE.Vector3();
      let camDist = 40;
      function cameraAt(t) {
        let i = 0;
        while (i < K.length - 1 && t >= K[i + 1].t) i++;
        const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
        const u = b.t > a.t ? (EASE[b.e || "io"])(clamp01((t - a.t) / (b.t - a.t))) : 1;
        tgt.set(lerp(a.tg[0], b.tg[0], u), lerp(a.tg[1], b.tg[1], u), lerp(a.tg[2], b.tg[2], u));
        const d = lerp(a.d, b.d, u), yaw = lerp(a.yaw, b.yaw, u) * D2R, pitch = lerp(a.pitch, b.pitch, u) * D2R;
        camDist = d;
        camera.position.set(tgt.x + d * Math.cos(pitch) * Math.sin(yaw), tgt.y + d * Math.sin(pitch), tgt.z + d * Math.cos(pitch) * Math.cos(yaw));
        camera.fov = lerp(a.fov, b.fov, u);
        camera.lookAt(tgt);
        camera.updateMatrixWorld();
        camUp.setFromMatrixColumn(camera.matrixWorld, 1);
        camera.position.addScaledVector(camUp, lerp(a.sh || 0, b.sh || 0, u));
        camera.updateProjectionMatrix();
      }

      function renderAt(t) {
        // the 3D layer is only on screen between the two morphs
        if (t < MORPH_IN - 0.05 || t > MORPH_OUT + 0.35) return;
        updateWorld(t);
        updateChords(t);
        updateBubbles(t);
        cameraAt(t);
        scene.fog.near = camDist * 0.9 + 6;
        scene.fog.far = camDist * 2.4 + 30;
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
      window.__officeReady && window.__officeReady();
    </script>
  </body>
</html>
